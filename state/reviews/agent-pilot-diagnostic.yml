  evidence_sufficiency: sufficient is supported: both conceptual and practical signals are
  present across the dimensions instructions/20-diagnostic.md requires (prior exposure,
  conceptual understanding, practical application, one misconception/boundary case via the
  resolved conflict). Stopping-rule case 1 applies.

