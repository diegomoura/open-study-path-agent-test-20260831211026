non_blocking_findings:
  - "study/assessments/TOPIC-001.yml and TOPIC-002.yml both set recovery.create_trello_card: true even though the learner's approved single authoritative task backend for this instance is github_issues (study.config.yml integrations.task_manager.provider: github_issues; study/integrations.md never mentions Trello as an active or considered tool). This mirrors the generic 'preferred: trello' architecture default rather than the actual per-instance selection, and instructions/55-evaluate-topic.md governs recovery task creation through 'the authoritative task backend' rather than this static field, so it does not currently cause an unwanted external write. Recommend removing or conditioning create_trello_card on the actually selected task_manager provider so the rubric file does not misrepresent the approved integration plan for this course."
  - "curriculum_proposal.materialized_topics and curriculum_generation.materialized_topics in .open-study-path/instance.yml now duplicate the same list (TOPIC-001, TOPIC-002). Not incorrect, but consider consolidating to a single field in a future replan/migration to avoid the two lists silently diverging later."
  - "TOPIC-001 content review suggests an optional second Mermaid diagram (packfile/compression) for learners who want to go further; genuinely optional and does not affect the approved outcomes."

verification_notes: >
  Independently reconstructed evidence rather than trusting the author's summary. Cross-checked
  state/intake-summary.json and state/diagnostic-summary.json against study.config.yml, study/roadmap.md
  and the two materialized topics to confirm the declared beginner level, confirmed competencies and
  knowledge gaps (blobs/trees/commits, branch/HEAD mechanics, never-used rebase, fear of multi-file
  conflicts, first-time formal PR review) are reflected without treating daily add/commit/push/pull
  fluency as internals mastery. Verified the 8-topic dependency graph (TOPIC-001 root; TOPIC-002 depends
  on TOPIC-001; TOPIC-003/TOPIC-004 both depend only on TOPIC-002 and can run in parallel; TOPIC-005 and
  TOPIC-006 converge from TOPIC-003+TOPIC-004; TOPIC-007 depends on TOPIC-006; TOPIC-008 converges from
  TOPIC-005+TOPIC-007) is acyclic and identical across study/roadmap.md's Mermaid graph, its prose
  "Pré-requisitos diretos" bullets, and every study/topics/TOPIC-00N.md front-matter `prerequisites` list;
  no topic contract or lesson infers a prerequisite from numeric adjacency instead of the declared direct
  prerequisite list. Confirmed the adaptive_rolling_window/lookahead_topics:2 configuration was honored:
  exactly TOPIC-001 and TOPIC-002 (the only currently eligible topics, since TOPIC-003/004 require
  TOPIC-002) were materialized, within full_upfront_max_topics:4 and full_upfront_max_hours:4, and total
  roadmap effort (~9.5h summed from topic estimated_hours) stays inside the previously approved 8.5-10.5h
  band. For both materialized topics, independently re-derived outcome traceability instead of trusting
  state/content-reviews/*: verified each approved learning_outcomes ID (LO-1..LO-3 per topic) has exactly
  one `<!-- open-study-path:outcome LO-n -->` marker placed beside content that actually teaches it (e.g.
  TOPIC-001 LO-1 beside "O que o commit realmente guarda", LO-2 beside "Inspecionando objetos de verdade",
  LO-3 beside "Da pasta de trabalho ao commit"; TOPIC-002 LO-1/LO-2/LO-3 beside the matching sections),
  that every study/assessments/TOPIC-00N.yml question's outcome_ids match the content review's recorded
  mapping, and that every rubric critical_misconception (commit-as-diff, add-without-staging,
  branch-as-copy, HEAD-is-always-main) is explicitly taught and corrected in "Erros comuns e como
  corrigir" before it appears in assessment question 4. Confirmed each materialized module contains
  exactly one explained Mermaid diagram, a bounded analogy with both "onde ajuda" and "onde deixa de
  funcionar" stated, two labeled worked examples, guided and independent practice, an unaided "Confira
  sem consultar" recall section, "Como este conteúdo foi construído" provenance disclosure identifying
  which analogies/examples are pedagogical adaptations, and a 3-7 row source table including a primary
  source (Pro Git), official reference docs, an explanatory GitHub Docs source and one interactive
  resource, each with a real chapter/section locator. Confirmed each assessment Issue Form's hidden
  marker, labels and completion command match instructions/55's deterministic resolution signals, and
  that both assessment forms' direct URLs match the actual repository slug and template filenames.
  Confirmed study/integrations.md correctly reflects the learner's minimal/GitHub-only preference and
  decide_later routine choice, that no external resource was created in this phase, and that
  study/roadmap.md's "Status atual" section no longer claims no lesson was materialized. No network
  access was available in this harness to re-fetch the cited external URLs; source accuracy was checked
  for internal consistency (chapter/section numbers matching the well-known Pro Git table of contents)
  rather than a live fetch.
