notes: >
  Verifiquei que o marcador de LO-1 acompanha a explicação de fast-forward vs.
  merge commit em "Merge commit: quando as duas branches divergiram", e que o
  marcador de LO-2 acompanha a leitura de git log --graph em "Lendo o histórico
  com git log --graph". Cada marcador aparece exatamente uma vez no módulo. Os
  dois exemplos trabalhados exigem previsão e verificação real (contar linhas
  parent, ler o grafo), não repetição de definição. A rubrica cobre os dois
  outcomes: LO-1 nas questões q1, q2, q4 e q5; LO-2 nas questões q2, q3 e q5 —
  esses conjuntos foram conferidos contra study/assessments/TOPIC-003.yml e
  batem exatamente. Os dois equívocos críticos ("todo merge cria commit de
  merge" e "o Git ignora o ancestral comum") são explicitamente ensinados e
  corrigidos na aula antes de aparecerem na avaliação (questão 4 e a seção
  "Erros comuns"). A aula assume apenas o pré-requisito direto (TOPIC-002:
  branches e HEAD) e não pressupõe conhecimento de conflitos (Aula 05), que é
  citado apenas como limite explícito da analogia e dos exemplos, não como
  pré-requisito. As quatro fontes citadas (Pro Git cap. 3, documentação oficial
  de git-merge e git-log, Learn Git Branching) foram conferidas quanto ao
  conteúdo real antes de serem citadas.

