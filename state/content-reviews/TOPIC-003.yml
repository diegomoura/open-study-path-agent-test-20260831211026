notes: >
  Confirmei que o marcador de LO-1 acompanha a explicação de fast-forward vs.
  merge commit em "Como o Git decide entre fast-forward e merge commit", e que
  o marcador de LO-2 acompanha a leitura do histórico resultante em "Lendo o
  histórico resultante". Cada marcador aparece exatamente uma vez no módulo. Os
  dois exemplos trabalhados cobrem exatamente os dois casos (fast-forward e
  merge commit) exigidos pelo entregável, e a prática independente exige que a
  pessoa produza e explique os dois cenários, não apenas repita a definição. A
  rubrica em study/assessments/TOPIC-003.yml mapeia os cinco itens aos outcomes
  aprovados (LO-1 em q1/q2/q4/q5, LO-2 em q2/q3/q5), e essa lista bate
  exatamente com outcome_coverage acima. Os dois equívocos críticos do tópico
  ("todo merge cria merge commit" e "merge apaga commits da branch mesclada")
  são ensinados e corrigidos explicitamente na aula antes de aparecerem na
  avaliação (questão 4 e seção "Erros comuns"). A navegação usa só o
  pré-requisito direto (Aula 02) e não assume que a Aula 02 é "a aula anterior
  por número" — o texto cita "Aula 02" pelo conteúdo (branches e HEAD), não
  pela posição. As quatro fontes citadas (Pro Git cap. 3, documentação oficial
  git-merge, GitHub Docs sobre merge de pull request, Learn Git Branching)
  foram conferidas quanto ao conteúdo real antes de serem citadas, e a analogia
  do documento colaborativo é identificada como adaptação pedagógica, não como
  fonte.

