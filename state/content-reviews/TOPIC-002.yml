notes: >
  Verifiquei que o marcador de LO-1 acompanha "Uma branch é uma referência, não
  uma cópia", o marcador de LO-2 acompanha "O que muda ao criar, trocar e apagar
  uma branch" (incluindo fast-forward e detached HEAD), e o marcador de LO-3
  acompanha "Inspecionando branches e HEAD de verdade". A retomada dos
  pré-requisitos usa apenas o que a Aula 01 (TOPIC-001) realmente ensinou —
  o conceito de commit como snapshot com hash — sem assumir conhecimento de
  numeração. O equívoco crítico "branch é uma cópia" é corrigido explicitamente
  na aula antes de aparecer na avaliação (questão 4). As quatro fontes citadas
  foram conferidas quanto ao conteúdo real (Pro Git cap. 10.3, documentação
  oficial de git-switch, GitHub Docs "About branches", Learn Git Branching); a
  analogia das etiquetas/post-it é identificada como adaptação pedagógica.

