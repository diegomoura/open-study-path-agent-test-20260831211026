notes: >
  Verifiquei que o marcador de LO-1 acompanha a explicação de blob/tree/commit em
  "O que o commit realmente guarda", o marcador de LO-2 acompanha os comandos de
  inspeção em "Inspecionando objetos de verdade", e o marcador de LO-3 acompanha
  a distinção working directory/staging area/repositório em "Da pasta de trabalho
  ao commit". Os dois exemplos trabalhados e a prática independente exigem
  aplicação real (identificar blobs reaproveitados vs. novos), não repetição de
  definição. A rubrica cobre os três outcomes e o equívoco crítico de "commit
  como diff" é explicitamente ensinado e corrigido na aula antes de aparecer na
  avaliação (questão 4). As quatro fontes citadas foram conferidas quanto ao
  conteúdo real (Pro Git cap. 10, documentação oficial de git-cat-file/git-ls-tree,
  GitHub Docs "About Git", Learn Git Branching) e a analogia do álbum de fotos é
  identificada como adaptação pedagógica, não como fonte.

