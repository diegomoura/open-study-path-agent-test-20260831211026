name: Validate curriculum state

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    # See validate-template.yml's workflow_call comment: lets
    # agent-pilot-setup.yml's auto-merge gate run this check inline against
    # its own branch, since a GITHUB_TOKEN-authored PR never gets its own
    # `pull_request`-triggered run.
    inputs:
      ref:
        description: Branch or SHA to validate (defaults to the calling workflow's own ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  curriculum-state:
    name: Curriculum proposal state
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Test curriculum proposal state
        run: python scripts/test_curriculum_state.py

      - name: Validate curriculum proposal state
        run: python scripts/validate_curriculum_state.py
