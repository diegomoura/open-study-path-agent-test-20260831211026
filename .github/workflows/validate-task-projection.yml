name: Validate task projection

on:
  pull_request:
    paths:
      - '.open-study-path/instance.yml'
      - 'state/integrations.json'
      - 'state/operations/**'
      - 'study/integrations.md'
      - 'instructions/41-task-backend-projection.md'
      - 'schemas/publication-operation.schema.json'
      - 'schemas/integrations-state.schema.json'
      - 'templates/integrations-state.json'
      - 'templates/publication-operation.json'
      - 'scripts/task_projection_*.py'
      - 'scripts/operation_branch.py'
      - 'scripts/render_integration_summary.py'
      - 'scripts/refresh_review_fingerprints.py'
      - 'scripts/validate_task_projection.py'
      - 'tests/test_task_projection_engine.py'
      - 'tests/test_operation_branch.py'
      - 'tests/test_refresh_review_fingerprints.py'
      - 'tests/test_validate_task_projection.py'
  push:
    branches: [main]
    paths:
      - '.open-study-path/instance.yml'
      - 'state/integrations.json'
      - 'state/operations/**'
      - 'study/integrations.md'
      - 'instructions/41-task-backend-projection.md'
      - 'schemas/publication-operation.schema.json'
      - 'schemas/integrations-state.schema.json'
      - 'templates/integrations-state.json'
      - 'templates/publication-operation.json'
      - 'scripts/task_projection_*.py'
      - 'scripts/operation_branch.py'
      - 'scripts/render_integration_summary.py'
      - 'scripts/refresh_review_fingerprints.py'
      - 'scripts/validate_task_projection.py'
      - 'tests/test_task_projection_engine.py'
      - 'tests/test_operation_branch.py'
      - 'tests/test_refresh_review_fingerprints.py'
      - 'tests/test_validate_task_projection.py'
  workflow_dispatch:
  workflow_call:
    # See validate-template.yml's workflow_call comment.
    inputs:
      ref:
        description: Branch or SHA to validate (defaults to the calling workflow's own ref)
        required: false
        type: string

concurrency:
  group: task-projection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Validate executable contract and durable state
        run: python scripts/validate_task_projection.py
      - name: Run behavioral adapter, migration and workflow tests
        run: |
          set -o pipefail
          PYTHONPATH=scripts python -m unittest \
            tests/test_task_projection_engine.py \
            tests/test_operation_branch.py \
            tests/test_refresh_review_fingerprints.py \
            tests/test_validate_task_projection.py 2>&1 | tee task-projection-tests.log
